name: Sync Riccardo publications

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync publications
        run: node scripts/sync-riccardo-publications.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/publications/riccardo.json; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications/riccardo.json
          git commit -m "Sync Riccardo publications"
          git push

name: Sync Serkan's selected publications

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync selected publications
        run: node scripts/sync-serkan-publications.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/publications/serkan.json; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications/serkan.json
          git commit -m "Sync Serkan selected publications"
          git push
